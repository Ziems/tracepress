[project]
name = "trace-miner"
version = "0.1.0"
description = "Config-driven map/filter/reduce for language model data pipelines"
readme = "README.md"
authors = [{ name = "Noah Ziems" }]
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.3.1",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.2",
    "rich>=14.0.0",
]

[project.urls]
Homepage = "https://github.com/Ziems/trace-miner"
Repository = "https://github.com/Ziems/trace-miner.git"

[project.scripts]
trace-miner = "trace_miner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
