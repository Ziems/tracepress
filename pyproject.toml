[project]
name = "tracepress"
version = "0.0.2"
description = "Squeeze all the juice form your traces. Trace analysis and observability. Find failures, PII, user frustration, or misbehavior in agent traces."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "dspy>=3.4",
    "jsonschema",
    "pandas>=2.0",
    "pyarrow>=14",
    "pydantic>=2.0",
]

[project.optional-dependencies]
notebook = ["tqdm", "ipython"]

[dependency-groups]
# Tests, plus what the example notebooks need to run locally.
dev = ["pytest>=8", "ipykernel>=7.3.0", "python-dotenv>=1.2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracepress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not live\""
markers = ["live: calls a real model (needs OPENROUTER_API_KEY)"]
