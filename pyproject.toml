[project]
name = "tracepress"
version = "0.2.2"
description = "LLM-powered map/reduce over agent traces: find failures, summarize runs, and watch agents live."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["agents", "traces", "llm", "dspy", "evaluation", "observability", "harbor", "terminal-bench"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "aiohttp>=3.9",
    "cloudpickle>=3.0",
    "dspy>=3.5,<3.6",
    "gepa>=0.1.4",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
jev = []  # Jev is built into DSPy 3.5; kept so `tracepress[jev]` still installs

[project.scripts]
tracepress = "tracepress.cli:main"

[project.urls]
Homepage = "https://github.com/Ziems/tracepress"
Repository = "https://github.com/Ziems/tracepress"
Issues = "https://github.com/Ziems/tracepress/issues"
Documentation = "https://github.com/Ziems/tracepress/tree/main/docs"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.6",
    "ty>=0.0.111",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"src/tracepress/telemetry.py" = ["BLE001", "S110"]

[tool.ty.src]
include = ["src", "tests"]

[[tool.ty.overrides]]
include = ["src/tracepress/signatures.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-explicit-return = "ignore"
invalid-type-form = "ignore"
missing-attribute = "ignore"
too-many-positional-arguments = "ignore"
