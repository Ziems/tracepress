[project]
name = "tracepress"
version = "0.1.1"
description = "LLM-powered map/reduce over agent traces: find failures, summarize runs, and watch agents live."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["agents", "traces", "llm", "dspy", "evaluation", "observability", "harbor", "terminal-bench"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "dspy>=3.4.1",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.4",
]

[project.urls]
Homepage = "https://github.com/Ziems/tracepress"
Repository = "https://github.com/Ziems/tracepress"
Issues = "https://github.com/Ziems/tracepress/issues"
Documentation = "https://github.com/Ziems/tracepress/tree/main/docs"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# DummyLM (DSPy's own test LM) still uses the old BaseLM.forward interface.
filterwarnings = [
    "ignore:Implementing custom LMs through BaseLM:DeprecationWarning",
    # Raised by litellm's response types, which the fake LM in tests/fakes.py builds.
    "ignore:Item .* is using the `ReadOnly` qualifier:UserWarning",
]
