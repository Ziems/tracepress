[project]
name = "trace-miner"
version = "0.1.0"
description = "Config-driven map/filter/reduce runtime for variable-size groups."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.3.1",
    "PyYAML>=6.0.2",
    "tqdm>=4.70.0",
]

[project.scripts]
trace-miner = "trace_miner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
