from: ./stages
id_field: session_id

lm:
  provider: openrouter
  default: deepseek/deepseek-v4.1-flash
  max_concurrent: 16

pipelines:
  - in: input/trajectories.jsonl
    out: output/pii.jsonl
    pipeline:
      - group:
          expand: split_harbor_steps
          pipeline:
            - map: detect_pii_in_step
          reduce: aggregate_pii_findings
