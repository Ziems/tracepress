from: ./stages
id_field: session_id

lm:
  max_concurrent: 256
  default:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash
  reduce:
    provider: openrouter
    model: anthropic/claude-sonnet-5

pipelines:
  - pipeline:
      - map: prepare_harbor_trajectory
      - group:
          expand: split_harbor_steps
          pipeline:
            - map: summarize_harbor_step
          reduce: categorize_harbor_trajectory
      - map: compact_harbor_category
