from: ./stages
id_field: session_id

lm:
  max_concurrent: 256
  default:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash

pipelines:
  - pipeline:
      - group:
          expand: split_harbor_steps
          pipeline:
            - map: detect_frustration_in_step
          reduce: aggregate_frustration_findings
