from: ./stages
id_field: session_id

lm:
  provider: openrouter
  default: deepseek/deepseek-v4.1-flash
  max_concurrent: 16

pipelines:
  - in: input/trajectories.jsonl
    out: output/categories.jsonl
    pipeline:
      - map: prepare_harbor_trajectory
      - group:
          expand: split_harbor_steps
          pipeline:
            - map: summarize_harbor_step
          reduce: categorize_harbor_trajectory
      - map: compact_harbor_category
