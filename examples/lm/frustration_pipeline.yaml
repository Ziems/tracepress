from: ./stages

id_field: session_id

lm:
  provider: openrouter
  default: deepseek/deepseek-v4.1-flash
  max_concurrent: 16

pipelines:
  - in: input/frustration-trajectories.jsonl
    out: output/frustration_findings.jsonl
    pipeline:
      - group:
          expand: split_harbor_steps
          pipeline:
            - map: detect_frustration_in_step
          reduce: aggregate_frustration_findings
