from: ./stages

id_field: session_id

lm:
  provider: openrouter
  default: deepseek/deepseek-v4.1-flash

pipelines:
  - in: input/harbor-trajectories.jsonl
    out: output/harbor_one_summary.jsonl
    pipeline:
      - filter: selected_harbor_trajectory
      - map: prepare_harbor_trajectory
      - group:
          expand: split_harbor_steps
          pipeline:
            - map: summarize_harbor_step
          reduce: analyze_harbor_trajectory
      - map: compact_harbor_summary
