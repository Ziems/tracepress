from: ./stages

id_field: id

lm:
  provider: openrouter
  default: deepseek/deepseek-v4.1-flash

pipelines:
  - in: input/traces.jsonl
    out: output/trace_overviews.jsonl
    pipeline:
      - filter: active
      - group:
          expand: split_readings
          pipeline:
            - map: label_reading
          reduce: summarize_trace
