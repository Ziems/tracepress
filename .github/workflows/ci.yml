name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --frozen pytest

  hello-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TRACE_MINER_HOME: ${{ runner.temp }}/trace-miner-home
      PROJECT_DIR: ${{ runner.temp }}/my-trace-pipelines
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Require OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Set the OPENROUTER_API_KEY repository secret to run the hello-world smoke test."
            exit 1
          fi
      - name: Install the current checkout
        run: uv tool install .
      - name: Init and run hello-world pipelines
        run: |
          trace-miner init "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          trace-miner summarize.yaml --progress
          trace-miner pii.yaml --progress
          trace-miner frustration.yaml --progress
      - name: Check planted outcomes
        run: python3 tests/hello_world_checks.py "$PROJECT_DIR"
