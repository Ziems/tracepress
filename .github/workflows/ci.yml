name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --frozen pytest

  hello-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TRACE_MINER_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set hello-world paths
        run: |
          echo "TRACE_MINER_HOME=${{ runner.temp }}/trace-miner-home" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=${{ runner.temp }}/my-trace-pipelines" >> "$GITHUB_ENV"
      - name: Require OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Set the OPENROUTER_API_KEY repository secret to run the hello-world smoke test."
            exit 1
          fi
      - name: Install the current checkout
        run: uv tool install .
      - name: Init and run hello-world pipelines
        run: |
          trace-miner init "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          log_dir="${{ runner.temp }}/pipeline-logs"
          mkdir -p "$log_dir"
          trace-miner summarize.yaml --progress >"$log_dir/summarize.log" 2>&1 &
          summarize_pid=$!
          trace-miner pii.yaml --progress >"$log_dir/pii.log" 2>&1 &
          pii_pid=$!
          trace-miner frustration.yaml --progress >"$log_dir/frustration.log" 2>&1 &
          frustration_pid=$!
          status=0
          wait "$summarize_pid" || status=1
          wait "$pii_pid" || status=1
          wait "$frustration_pid" || status=1
          for name in summarize pii frustration; do
            echo "::group::$name.yaml"
            cat "$log_dir/$name.log"
            echo "::endgroup::"
          done
          exit "$status"
      - name: Check planted outcomes
        run: python3 tests/hello_world_checks.py "$PROJECT_DIR"
