name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --frozen pytest

  hello-world:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TRACE_MINER_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set hello-world paths
        run: |
          echo "TRACE_MINER_HOME=${{ runner.temp }}/trace-miner-home" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=${{ runner.temp }}/my-trace-pipelines" >> "$GITHUB_ENV"
      - name: Require OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Set the OPENROUTER_API_KEY repository secret to run the hello-world smoke test."
            exit 1
          fi
      - name: Install the current checkout
        run: uv tool install .
      - name: Init and run hello-world pipelines
        run: |
          trace-miner init "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          log_dir="${{ runner.temp }}/pipeline-logs"
          mkdir -p "$log_dir"
          trace-miner run summarize.yaml --progress >"$log_dir/summarize.log" 2>&1 &
          summarize_pid=$!
          trace-miner run pii.yaml --progress >"$log_dir/pii.log" 2>&1 &
          pii_pid=$!
          trace-miner run frustration.yaml --progress >"$log_dir/frustration.log" 2>&1 &
          frustration_pid=$!
          trace-miner run category.yaml --progress >"$log_dir/category.log" 2>&1 &
          category_pid=$!
          trace-miner serve alerts.yaml --port 8765 >"$log_dir/alerts.log" 2>&1 &
          alerts_pid=$!
          status=0
          if ! python3 - "$alerts_pid" <<'PY'
          import socket
          import sys
          import time

          pid = int(sys.argv[1])
          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 8765), 0.2):
                      raise SystemExit(0)
              except OSError:
                  time.sleep(0.1)
          raise SystemExit(f"serve did not accept connections (pid {pid})")
          PY
          then
            status=1
          else
            demo_python="$(uv tool dir)/trace-miner/bin/python"
            demo_code=0
            "$demo_python" client_demo.py >"$log_dir/client_demo.log" 2>&1 || demo_code=$?
            if [ "$demo_code" -ne 1 ]; then
              echo "client_demo.py exited $demo_code; expected 1" >&2
              status=1
            fi
          fi
          kill "$alerts_pid" 2>/dev/null || true
          wait "$alerts_pid" || true
          wait "$summarize_pid" || status=1
          wait "$pii_pid" || status=1
          wait "$frustration_pid" || status=1
          wait "$category_pid" || status=1
          for name in summarize pii frustration category alerts client_demo; do
            echo "::group::$name"
            cat "$log_dir/$name.log"
            echo "::endgroup::"
          done
          exit "$status"
      - name: Check planted outcomes
        run: python3 tests/hello_world_checks.py "$PROJECT_DIR"
